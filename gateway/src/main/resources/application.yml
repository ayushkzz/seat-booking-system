server:
  port: ${PORT:8000}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          routes:
            # Creating a booking is the expensive, abusable call, so it gets its own stricter limit.
            - id: create-booking
              uri: ${BOOKING_SERVICE_URL:http://localhost:8080}
              predicates:
                - Method=POST
                - Path=/api/shows/*/bookings
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_BOOKINGS_PER_SECOND:5}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BOOKINGS_BURST:10}
            - id: notifications
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/*/notifications
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_PER_SECOND:50}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:100}
            - id: booking-api
              uri: ${BOOKING_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_PER_SECOND:50}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
