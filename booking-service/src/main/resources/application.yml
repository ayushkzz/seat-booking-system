server:
  port: ${PORT:8080}

spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookings}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # db/demo seeds one show ("Demo Night", 200 seats) so the API can be tried right away.
    locations: classpath:db/migration,classpath:db/demo
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mvc:
    problemdetails:
      enabled: true

booking:
  # How long seats stay held while the customer pays.
  hold-ttl: PT5M
  # How often unpaid bookings past their hold are expired.
  expiry-scan-interval: PT5S
  # How often the outbox relay publishes pending events to Kafka.
  outbox-poll-interval: PT0.1S

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
