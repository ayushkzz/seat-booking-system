server:
  port: ${PORT:8080}

spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookings}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # db/demo seeds one show ("Demo Night", 200 seats) so the API can be tried right away.
    locations: classpath:db/migration,classpath:db/demo
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # payment results are consumed with this many threads (one per partition at most)
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
  mvc:
    problemdetails:
      enabled: true

booking:
  # How long seats stay held while the customer pays.
  hold-ttl: PT5M
  # How often unpaid bookings past their hold are expired.
  expiry-scan-interval: PT5S
  # How often the outbox relay publishes pending events to Kafka.
  outbox-poll-interval: PT0.1S
  # How long a rendered seat map is served from Redis, i.e. how stale a seat map can be.
  seat-map-cache-ttl: ${SEAT_MAP_CACHE_TTL:PT1S}
  waiting-room:
    # How long an admitted user has to make a booking before their place goes to the next in line.
    session-ttl: ${WAITING_ROOM_SESSION_TTL:PT3M}
    # A waiting user who has not checked their position for this long is dropped from the queue.
    heartbeat-ttl: PT30S
    # How often free places are handed to the users at the front of the queue.
    admit-interval: PT1S

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
