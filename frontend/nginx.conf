server {
    listen 80;
    root /usr/share/nginx/html;

    # The browser only ever talks to this server: the API is forwarded to the gateway,
    # so the app and the API share one origin and no CORS configuration is needed.
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
